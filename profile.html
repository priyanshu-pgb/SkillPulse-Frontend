<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Citizen Profile & Credentials — Bharat SkillPulse | भारत सरकार (MSDE / NCVET)</title>
  <meta name="description" content="Manage your official skilling profile, APAAR credentials, and government course enrollments on Bharat SkillPulse.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="js/antigravity.js"></script>
  <link rel="stylesheet" href="css/field-atlas.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/watermark.css">
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    @media (max-width: 900px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }
    }
    .profile-card {
      background: var(--color-surface, #ffffff);
      border: 1px solid var(--color-border, #e5e7eb);
      border-radius: var(--radius-lg, 12px);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 1rem auto;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--color-primary, #0f172a);
    }
    .avatar-upload-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--color-primary, #0f172a);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      border: 2px solid #fff;
      transition: background 0.2s ease;
    }
    .avatar-upload-btn:hover {
      background: var(--color-teal, #0d9488);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-secondary, #475569);
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--color-border, #cbd5e1);
      border-radius: var(--radius-md, 8px);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--color-text, #0f172a);
      background-color: var(--color-bg, #f8fafc);
      transition: border-color 0.2s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-teal, #0d9488);
      background-color: #fff;
    }
    .form-control[readonly] {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-teal { background: #ccfbf1; color: #0f766e; }
    .badge-indigo { background: #e0e7ff; color: #3730a3; }
    .badge-coral { background: #ffe4e6; color: #9f1239; }
    .badge-neutral { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body class="bg-gray">

  <!-- Header / Navigation with Glassmorphism -->
  <header class="glass-header" style="position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--glass-border);">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
      <a href="index.html" style="display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: inherit;">
        <div style="background: #FFFFFF; border: 2px solid rgba(217, 119, 6, 0.45); border-radius: 50%; padding: 2px; display: flex; align-items: center; justify-content: center;">
          <svg class="bharat-sovereign-crest" viewBox="0 0 48 48" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#FF9933" stroke-width="1.8" stroke-dasharray="3,1.5"/>
            <circle cx="24" cy="24" r="19.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
            <circle cx="24" cy="24" r="16.5" fill="none" stroke="#0B2545" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="3.2" fill="#0B2545"/>
            <circle cx="24" cy="24" r="1.3" fill="#FFFFFF"/>
          </svg>
        </div>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--color-deep-indigo);">SkillPulse <span class="sovereign-bharat-tag">BHARAT</span></span>
      </a>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
          <span class="theme-icon">☀️</span>
          <span class="theme-text">Light</span>
        </button>
        <button id="nav-back-btn" class="btn btn-outline btn-sm" onclick="history.back()" style="font-size: 0.85rem; padding: 0.4rem 0.9rem;">← Back</button>
        <a href="index.html" class="btn btn-sm btn-outline" style="text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.9rem;">Home</a>
      </div>
    </div>
  </header>

  <!-- Main Profile Layout -->
  <main class="profile-layout">
    
    <!-- Left Column: User Summary & Password Change -->
    <aside style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="profile-card" style="text-align: center;">
        <div class="avatar-wrapper">
          <img id="profile-avatar-preview" class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Profile Picture">
          <label for="profile-photo-input" class="avatar-upload-btn" title="Upload Photo">
            📷
          </label>
          <input type="file" id="profile-photo-input" accept="image/*" style="display: none;">
        </div>
        <h2 style="font-size: 1.1rem; font-weight: 700; margin: 0 0 0.25rem 0; color: var(--color-deep-indigo);" id="user-display-name">Demo User</h2>
        <p style="font-size: 0.8rem; color: var(--color-text-muted); margin: 0 0 1rem 0;" id="user-display-role">Vocational Specialist</p>
        <div style="font-size: 0.8rem; background: var(--color-parchment); padding: 0.75rem; border-radius: 8px; text-align: left; border: 1px solid var(--color-border);">
          <div style="margin-bottom: 0.4rem; color: var(--color-text-primary);"><strong>System ID:</strong> <span id="display-atlas-id">FA-88902</span></div>
          <div style="color: var(--color-text-primary);"><strong>Status:</strong> <span class="badge badge-teal">Verified</span></div>
        </div>
      </div>

      <!-- Password Reset Form -->
      <div class="profile-card">
        <h3 style="font-size: 1rem; font-weight: 700; margin: 0 0 1rem 0; color: var(--color-deep-indigo);">Change Password</h3>
        <form id="change-password-form">
          <div class="form-group">
            <label for="current-password">Current Password</label>
            <input type="password" id="current-password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn" style="width: 100%; background: var(--color-teal); color: #fff; padding: 0.6rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; border: none; cursor: pointer;">
            Update Password
          </button>
        </form>
      </div>
    </aside>

    <!-- Right Column: Profile Details & Courses -->
    <section style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <!-- Profile Information Form -->
      <div class="profile-card">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin: 0 0 1.25rem 0; color: var(--color-deep-indigo); padding-bottom: 0.75rem; border-bottom: 1px solid var(--color-border);">Personal Details</h3>
        <form id="profile-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="profile-name">Full Name</label>
              <input type="text" id="profile-name" class="form-control" value="Demo User" required>
            </div>
            <div class="form-group">
              <label for="profile-email">Email Address</label>
              <input type="email" id="profile-email" class="form-control" value="demo@fieldatlas.org" readonly title="Email cannot be changed directly">
            </div>
            <div class="form-group">
              <label for="profile-phone">Phone Number</label>
              <input type="tel" id="profile-phone" class="form-control" value="+91 98765 43210">
            </div>
            <div class="form-group">
              <label for="profile-id">Field Atlas ID</label>
              <input type="text" id="profile-id" class="form-control" value="FA-88902" readonly>
            </div>
            <div class="form-group">
              <label for="profile-language">Preferred Language</label>
              <select id="profile-language" class="form-control">
                <option value="en">English</option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="mr">Marathi (मराठी)</option>
                <option value="te">Telugu (తెలుగు)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="profile-provider">Training Provider / NGO</label>
              <input type="text" id="profile-provider" class="form-control" value="Apex Vocational Skill Council">
            </div>
            <div class="form-group">
              <label for="profile-district">District</label>
              <input type="text" id="profile-district" class="form-control" value="Central Delhi">
            </div>
            <div class="form-group">
              <label for="profile-state">State / Region</label>
              <input type="text" id="profile-state" class="form-control" value="Delhi (NCT)">
            </div>
          </div>

          <div class="form-group">
            <label for="profile-address">Address</label>
            <input type="text" id="profile-address" class="form-control" value="102 Sector 4, Technical Training Complex">
          </div>

          <div class="form-group">
            <label for="profile-bio">Bio / Professional Summary</label>
            <textarea id="profile-bio" class="form-control" rows="3" style="resize: vertical;">Certified vocational specialist focused on renewable energy maintenance, solar grid setup, and youth employability tracking.</textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
            <button type="submit" class="btn" style="background: var(--color-teal); color: white; border: none; padding: 0.65rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;">
              Save Profile Changes
            </button>
          </div>
        </form>
      </div>

      <!-- Enrolled/Instructed Courses Summary -->
      <div class="profile-card">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin: 0 0 1rem 0; color: var(--color-deep-indigo);">Course Allocations & Records</h3>
        <div id="profile-courses-container">
          <!-- Populated by profile.js -->
        </div>
      </div>

    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/mock-auth.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
