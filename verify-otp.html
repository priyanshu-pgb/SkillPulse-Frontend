@
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Verify Email OTP — SkillPulse</title>

  <!-- Modern Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Core Application Stylesheets -->
  <link rel="stylesheet" href="css/field-atlas.css?v=2.3.0">
  <link rel="stylesheet" href="css/responsive.css?v=2.3.0">
  <!-- Modern Typography (Outfit + Plus Jakarta Sans + JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div
    style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; background-color: var(--color-parchment); position: relative;">

    <!-- Top Navigation Controls: Theme Toggle (☀️/🌙) -->
    <div style="position: absolute; top: 1.25rem; right: 1.5rem;" class="glass-pill">
      <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <span class="theme-icon">☀️</span>
        <span class="theme-text">Light</span>
      </button>
    </div>

    <div style="max-width: 440px; width: 100%; margin-top: 1.5rem;">
      <div class="glass-panel" style="text-align: center; margin-bottom: 1.5rem; padding: 1.25rem; border-radius: var(--radius-lg);">
        <div
          style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: linear-gradient(135deg, var(--color-teal), #18A89B); border-radius: var(--radius-lg); color: white; margin-bottom: 0.5rem; box-shadow: 0 4px 10px rgba(14, 129, 118, 0.3);">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--color-deep-indigo); letter-spacing: -0.02em;">OTP Verification</h1>
        <p style="font-size: 0.825rem; color: var(--color-text-muted);">Enter the 6-digit passcode sent to your registered mobile/email.</p>
      </div>

      <div class="glass-card"
        style="border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 2.25rem 2rem; box-shadow: var(--shadow-lg);">
        <form id="verify-otp-form">
          <div class="form-group">
            <label class="form-label" for="otp-email">Email Address</label>
            <input type="email" id="otp-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="otp-code">6-Digit Code</label>
            <input type="text" id="otp-code" class="form-control" placeholder="123456" maxlength="6" pattern="[0-9]{6}"
              required
              style="letter-spacing: 0.25em; font-size: 1.25rem; text-align: center; font-family: var(--font-mono);">
            <small style="display: block; margin-top: 0.35rem; color: var(--color-text-muted); font-size: 0.75rem;">Code
              expires in 10 minutes (max 3 verification attempts).</small>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Verify & Continue</button>
        </form>

        <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; font-size: 0.85rem;">
          <button type="button" id="btn-send-otp" class="btn btn-outline btn-sm" data-purpose="registration">Resend
            Code</button>
          <a href="login.html"
            style="color: var(--color-teal); font-weight: 700; text-decoration: none; display: flex; align-items: center;">Back
            to Login</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Core JavaScript Libraries -->
  <script src="js/config.js"></script>
  <script src="js/api.js?v=2.3.0"></script>
  <script src="js/i18n.js?v=2.3.0"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>

</html>
