<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Aadhaar / Citizen OTP Verification — Bharat SkillPulse | भारत सरकार</title>

  <!-- Authoritative Sovereign Typography (No Generic AI Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Core Application Stylesheets -->
  <link rel="stylesheet" href="css/field-atlas.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div
    style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; background-color: var(--color-parchment); position: relative;">

    <!-- Top Navigation Controls: Theme Toggle (☀️/🌙) -->
    <div style="position: absolute; top: 1.25rem; right: 1.5rem;" class="glass-pill">
      <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <span class="theme-icon">☀️</span>
        <span class="theme-text">Light</span>
      </button>
    </div>

    <div style="max-width: 440px; width: 100%; margin-top: 1.5rem;">
      <div class="glass-panel" style="text-align: center; margin-bottom: 1.5rem; padding: 1.25rem; border-radius: var(--radius-lg);">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; background: #FFFFFF; border: 2px solid rgba(217, 119, 6, 0.45); border-radius: 50%; margin-bottom: 0.5rem; box-shadow: 0 4px 10px rgba(15, 37, 71, 0.15);">
          <svg class="bharat-sovereign-crest" viewBox="0 0 48 48" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#FF9933" stroke-width="1.8" stroke-dasharray="3,1.5"/>
            <circle cx="24" cy="24" r="19.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
            <circle cx="24" cy="24" r="16.5" fill="none" stroke="#0B2545" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="3.2" fill="#0B2545"/>
            <circle cx="24" cy="24" r="1.3" fill="#FFFFFF"/>
          </svg>
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--color-deep-indigo); letter-spacing: -0.02em; font-family: 'Outfit', sans-serif;">SkillPulse <span class="sovereign-bharat-tag">BHARAT</span></h1>
        <p style="font-size: 0.8rem; color: var(--color-teal); font-weight: 700;">Aadhaar / Mobile OTP Verification · GOVT. OF INDIA</p>
      </div>

      <div class="glass-card"
        style="border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 2.25rem 2rem; box-shadow: var(--shadow-lg);">
        <form id="verify-otp-form">
          <div class="form-group">
            <label class="form-label" for="otp-email">Email Address</label>
            <input type="email" id="otp-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="otp-code">6-Digit Code</label>
            <input type="text" id="otp-code" class="form-control" placeholder="123456" maxlength="6" pattern="[0-9]{6}"
              required
              style="letter-spacing: 0.25em; font-size: 1.25rem; text-align: center; font-family: var(--font-mono);">
            <small style="display: block; margin-top: 0.35rem; color: var(--color-text-muted); font-size: 0.75rem;">Code
              expires in 10 minutes (max 3 verification attempts).</small>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Verify & Continue</button>
        </form>

        <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; font-size: 0.85rem;">
          <button type="button" id="btn-send-otp" class="btn btn-outline btn-sm" data-purpose="registration">Resend
            Code</button>
          <a href="login.html"
            style="color: var(--color-teal); font-weight: 700; text-decoration: none; display: flex; align-items: center;">Back
            to Login</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Core JavaScript Libraries -->
  <script src="js/antigravity.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>

</html>
