<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Reset Password — Field Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/field-atlas.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/watermark.css">
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; background-color: var(--color-parchment); position: relative;">

    <!-- Top Navigation Controls: Theme Toggle (☀️/🌙) -->
    <div style="position: absolute; top: 1.25rem; right: 1.5rem;" class="glass-pill">
      <button type="button" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <span class="theme-icon">☀️</span>
        <span class="theme-text">Light</span>
      </button>
    </div>

    <div style="max-width: 440px; width: 100%; margin-top: 1.5rem;">
      <!-- Brand Header -->
      <div class="glass-panel" style="text-align: center; margin-bottom: 1.5rem; padding: 1.25rem; border-radius: var(--radius-lg);">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: linear-gradient(135deg, var(--color-teal), #18A89B); border-radius: var(--radius-lg); color: white; margin-bottom: 0.5rem; box-shadow: 0 4px 10px rgba(14, 129, 118, 0.3);">
          <i data-lucide="compass" style="width: 26px; height: 26px;"></i>
        </div>
        <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--color-deep-indigo); letter-spacing: -0.02em;">Reset Password</h1>
        <p style="font-size: 0.8rem; color: var(--color-teal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;">Citizen Account Recovery</p>
      </div>

      <!-- Reset Card with Glassmorphism -->
      <div class="glass-card" style="border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 2.25rem 2rem; box-shadow: var(--shadow-lg);">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--color-deep-indigo); margin-bottom: 0.4rem;">Forgot Your Password?</h2>
        <p style="font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 1.5rem;">Enter your email, the OTP code, and a new password to reset your account.</p>

        <form id="forgot-password-form">
          <div class="form-group">
            <label class="form-label" for="reset-email">Email Address</label>
            <input type="email" id="reset-email" class="form-control" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label class="form-label" for="reset-code" style="margin-bottom: 0;">OTP Code</label>
              <button type="button" id="btn-send-otp" data-purpose="password_reset" class="btn btn-outline btn-sm" style="padding: 0.25rem 0.75rem; font-size: 0.75rem; min-height: auto;">
                Send Code
              </button>
            </div>
            <input type="text" id="reset-code" class="form-control" placeholder="123456" required maxlength="6" style="font-family: var(--font-mono);">
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-new-password">New Password</label>
            <input type="password" id="reset-new-password" class="form-control" placeholder="Min 8 characters" required minlength="8">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
        </form>
      </div>

      <!-- Demo Note -->
      <div style="margin-top: 1.25rem; background: rgba(14, 129, 118, 0.08); border: 1px dashed var(--color-teal); border-radius: var(--radius-md); padding: 1rem; font-size: 0.8rem;">
        <div style="font-weight: 700; color: var(--color-teal); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
          <i data-lucide="info" style="width: 14px; height: 14px;"></i> Demo Mode
        </div>
        <div style="color: var(--color-deep-indigo);">
          Use OTP code <strong style="font-family: var(--font-mono); color: var(--color-teal);">123456</strong>. Password reset always succeeds.
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--color-text-secondary);">
        <a href="login.html" style="color: var(--color-teal); font-weight: 700; text-decoration: none;">← Back to Sign In</a>
      </div>
    </div>
  </div>

  <div class="watermark">#crafted by team Synkro</div>
  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/mock-auth.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
